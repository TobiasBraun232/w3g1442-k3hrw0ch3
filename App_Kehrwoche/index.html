<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Kehrwochenplan</title>
<meta name="theme-color" content="#F7F5F1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kehrwoche">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- Erstbesuch: Wohnung auswählen -->
  <section id="onboarding" class="onboarding">
    <h1>Willkommen 👋</h1>
    <p class="sub">Welche Wohnung ist deine? Das merken wir uns nur auf diesem Gerät.</p>
    <div id="wohnungGrid" class="wohnung-grid"></div>
    <button id="saveWohnungBtn" class="btn">Speichern</button>
  </section>

  <!-- Hauptansicht -->
  <section id="main">

    <header id="header" class="header">
      <div class="header-left">
        <div id="avatar" class="avatar"></div>
        <div class="header-labels">
          <p class="header-eyebrow">Deine Wohnung</p>
          <p id="headerTitle" class="header-title"></p>
        </div>
      </div>
      <button id="changeWohnungBtn" class="link-btn">Ändern</button>
    </header>

    <div class="week-nav">
      <button id="prevWeek" class="nav-btn" aria-label="Vorherige Woche">‹</button>
      <span id="weekLabel" class="week-label"></span>
      <button id="nextWeek" class="nav-btn" aria-label="Nächste Woche">›</button>
    </div>

    <div id="weekCard" class="week-card">
      <p id="headline" class="headline"></p>
      <p id="subline" class="subline"></p>
      <span id="weekTag" class="tag hidden"></span>
    </div>

    <div id="actions" class="actions"></div>

    <div id="vertretungForm" class="inline-form hidden">
      <div class="row">
        <div>
          <label for="vertretungVon">Von</label>
          <input type="date" id="vertretungVon">
        </div>
        <div>
          <label for="vertretungBis">Bis</label>
          <input type="date" id="vertretungBis">
        </div>
      </div>
      <label for="vertretungNotiz">Wer vertritt dich? (optional)</label>
      <input type="text" id="vertretungNotiz" placeholder="z. B. Nachbarin aus Wohnung 6">
      <button id="vertretungSave" class="btn">Vertretung speichern</button>
    </div>

    <div id="tauschForm" class="inline-form hidden">
      <label for="tauschNotiz">Notiz (optional)</label>
      <input type="text" id="tauschNotiz" placeholder="z. B. Tausch mit Wohnung 2">
      <button id="tauschSave" class="btn">Tausch speichern</button>
    </div>

    <textarea id="noteField" class="note-field" placeholder="Notiz für dich selbst zu dieser Woche..."></textarea>

    <div class="countdown">
      <span id="countdownText"></span>
    </div>

  </section>
</div>

<script src="app.js"></script>
</body>
</html>
